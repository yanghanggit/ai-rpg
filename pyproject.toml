[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rpg"
version = "0.1.0"
description = "A multi-agent game framework based on ECS architecture for DBG games"
authors = [{name = "Yang Hang", email = "yanghang@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["multi-agent", "game", "framework", "ECS", "DBG", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = {homepage = "https://github.com/yanghanggit/ai-rpg", repository = "https://github.com/yanghanggit/ai-rpg.git"}
dependencies = [
    # Core web framework
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "click>=8.1.7",
    # HTTP client libraries
    "aiohttp>=3.9.3",
    "requests>=2.32.2",
    # Text-to-image generation
    "replicate>=1.0.7",
    # AI and embeddings
    "sentence-transformers>=4.1.0",
    # Database
    "sqlalchemy>=2.0.27",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.10",
    # Validation and serialization
    "pydantic>=2.11.7",
    # Authentication
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
    # Utilities
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "overrides>=7.7.0",
    "markdown-it-py>=3.0.0",
    # Task queue
    "procrastinate[psycopg]>=3.9.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    
    # Type checking
    "mypy==2.3.1",
    
    # Code formatting and linting
    "black>=25.1.0",
    "ruff>=0.5.0",
    "pre-commit>=4.2.0",
    
    # Type stubs
    "pandas-stubs>=2.2.1.240316",
    "types-cffi>=1.17.0.20250523",
    "types-jsonschema>=4.22.0.20240610",
    "types-passlib>=1.7.7.20250602",
    "types-psycopg2>=2.9.21.20250915",
    "types-psutil>=7.0.0.20250822",
    "types-pyasn1>=0.6.0.20250914",
    "types-pyopenssl>=24.1.0.20240722",
    "types-python-jose>=3.5.0.20250531",
    "types-pytz>=2024.1.0.20240203",
    "types-pyyaml>=6.0.12.12",
    "types-requests>=2.32.0.20240907",
    "types-setuptools>=80.9.0.20250529",
    
    # Additional dev tools
    "psutil>=7.1.0",
]

[project.scripts]
ai-rpg-server = "ai_rpg.cli.server:main"
ai-rpg-agent-game = "ai_rpg.cli.agent_game:main"
ai-rpg-agent-api = "ai_rpg.cli.agent_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
show_column_numbers = true
pretty = true
incremental = true
cache_dir = ".mypy_cache"
ignore_missing_imports = false
mypy_path = "src"

[tool.pytest.ini_options]
# 测试发现
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 导入：显式把 src 与仓库根加入 sys.path；importlib 模式不做隐式 sys.path 注入
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers --import-mode=importlib"
# asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 自定义标记
markers = [
    "integration: marks tests as integration tests",
    "database: marks tests as database tests",
    "demo: marks tests as demonstration tests",
    "slow: marks tests as slow running tests",
    "comprehensive: marks tests as comprehensive tests",
    "excel: marks tests as Excel file operation tests",
    "error_handling: marks tests as error handling tests",
    "asyncio: marks tests as asynchronous tests",
]
# 过滤警告
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated.*:DeprecationWarning:openpyxl.*",
    "ignore:'crypt' is deprecated.*:DeprecationWarning:passlib.*",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".mypy_cache", ".nox", ".pants.d", ".pytype", ".ruff_cache",
    ".svn", ".tox", ".venv", "__pypackages__", "_build", "buck-out",
    "build", "dist", "node_modules", "venv", "gen_runtimes", "gen_worlds", "logs",
]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# 启用规则：未使用导入、重复导入、import排序等
# F401: 未使用的导入 - 现已全局启用，不再忽略
# F402: 模块级导入被局部导入覆盖  
# F403: 星号导入（from module import *）
# F811: 重复定义
# E401: 多个导入在一行
# I001: import排序
select = ["F401", "F402", "F403", "F811", "E401", "I001"]
ignore = []
fixable = ["F401", "F402", "F403", "F811", "E401", "I001"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 通过 star import 做再导出，F401/F403 在此文件属预期
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
# import排序配置
known-first-party = ["ai_rpg"]


